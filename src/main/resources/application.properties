spring.application.name=teamwork-backend

# Khóa dịch vụ không ghi vào file này; file này chỉ tham chiếu tên biến dạng ${TEN_BIEN}.
# Khi dev: tự đọc file .env (dạng TEN_BIEN=gia_tri) ở thư mục đang chạy, tức thư mục gốc dự án, nếu có.
# Khi triển khai: đặt biến môi trường của hệ thống. Biến hệ thống được ưu tiên hơn giá trị trong .env.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/teamwork}
spring.datasource.username=${DB_USERNAME:teamwork}
spring.datasource.password=${DB_PASSWORD:teamwork}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Origin được phép gọi API từ trình duyệt (CORS); nhiều origin thì cách nhau bằng dấu phẩy.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Khóa ký token đăng nhập (JWT), ít nhất 32 byte. Bắt buộc: để trống thì backend báo lỗi và không khởi động
# (JwtProperties). Không ghi khóa thật vào file này.
app.jwt.secret=${JWT_SECRET:}

# Dịch vụ ngoài: Cloudflare R2 (lưu tệp), AI (tóm tắt) và email (SMTP). Chưa có tính năng nào dùng nên các
# biến đều tùy chọn; khi làm tính năng nào thì chuyển biến của tính năng đó sang bắt buộc trong lớp *Properties.
app.storage.account-id=${R2_ACCOUNT_ID:}
app.storage.access-key-id=${R2_ACCESS_KEY_ID:}
app.storage.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.storage.bucket=${R2_BUCKET:}

app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:}

app.mail.host=${MAIL_HOST:}
app.mail.port=${MAIL_PORT:}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
